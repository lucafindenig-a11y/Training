<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fafafd">
  <title>Trainingsplan</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Training">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Darstellung vor dem ersten Zeichnen setzen (verhindert kurzes Aufblitzen).
    (function () {
      var pref = 'hell';
      try { pref = localStorage.getItem('trainingsplan.darstellung') || 'hell'; } catch (e) {}
      var dark = pref === 'dunkel' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">Zum Inhalt springen</a>
  <header class="topbar">
    <a id="backBtn" class="icon-btn" href="#/heute" aria-label="Zurück" hidden></a>
    <h1 id="pageTitle">Trainingsplan</h1>
    <a id="syncStatus" class="sync" href="#/einstellungen"></a>
    <a class="icon-btn settings-link" href="#/einstellungen" aria-label="Einstellungen und Datensicherung"></a>
  </header>

  <main id="app" tabindex="-1">
    <p class="loading">Daten werden geladen …</p>
  </main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <a href="#/heute" data-tab="heute"><span class="tab-ico"></span><span>Heute</span></a>
    <a href="#/plan" data-tab="plan"><span class="tab-ico"></span><span>Plan</span></a>
    <a href="#/katalog" data-tab="katalog"><span class="tab-ico"></span><span>Übungen</span></a>
    <a href="#/verlauf" data-tab="verlauf"><span class="tab-ico"></span><span>Verlauf</span></a>
    <a href="#/auswertung/woche" data-tab="auswertung"><span class="tab-ico"></span><span>Auswertung</span></a>
  </nav>

  <div id="sheetRoot" class="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
